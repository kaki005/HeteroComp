[project]
name = "heterocomp"
version = "0.1.0"
description = "Heterocomp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox==0.11.9",
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "kagglehub>=0.3.12",
    "matplotlib>=3.10.1",
    "numba>=0.61.0",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "pathlib>=1.0.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "wordcloud>=1.9.4",
    "polyagamma>=2.0.2",
    "hydra-core>=1.3.2",
    "optax>=0.2.4",
    "beartype>=0.20.2",
    "quads>=1.1.0",
    "jaxopt>=0.8.5",
    "graphviz>=0.21",
    "statsmodels>=0.14.4",
    "jinja2>=3.1.6",
    "pysad>=0.3.4",
    "rrcf>=0.4.4",
    "precision-recall-gain>=0.1.1",
    "asyncio>=3.4.3",
    "fastparquet>=2024.11.0",
    "office365>=0.3.15",
    "networkx>=3.5",
    "pyshp>=2.3.1",
    "geopandas>=1.1.1",
    "adjusttext>=1.3.0",
    "pydeck>=0.9.1",
    "opencv-python>=4.12.0.88",
    "fonttools>=4.60.0",
    "tensorflow-probability>=0.25.0",
    "rich>=13.9.4",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pre-commit>=4.1.0", "ruff>=0.8.0"]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["_src"]


[tool.ruff]
line-length = 200 # 1行の最大文字数

[tool.ruff.lint]
# チェックするエラーの種類
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
fixable = ["ALL"]
# 除外するエラーの種類
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W191", # indentation contains tabs
    "B904", # raise ... from ... になっていない場合のエラーを無視
    # "F401",  # imported but not used
    "UP008",
    "B007",
    "UP035", #`typing.Dict` is deprecated, use `dict` insteadß
    "F401",
    "B905",
    "F722",
    "F821",
]

# ファイルごとのエラー除外
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# isort の設定
[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]

[tool.ruff.lint.pyupgrade]
# Python3.8互換のための設定
keep-runtime-typing = true


[tool.ruff.lint.mccabe]
max-complexity = 5


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
