defaults:
  - base_config # base config
  - _self_
model:
    k: 20
    width: 30
    verbose : True
    iter_num: 30
    learning_rate: 0.1
    anomaly: True

data:
  name: "CUPID"
  time_idx: "Timestamp"
  freq : "S"
  init_len :  1200
  categorical_idxs : ["Source IP", "Destination IP","Source Port", "Destination Port", "Protocol"]
  # continuous_idxs: ["Flow Duration", "Total Length of Fwd Packet", "Total Length of Bwd Packet", "Fwd Header Length", "Bwd Header Length", "Flow IAT Mean", "Flow Bytes/s", "Flow Packets/s", "Fwd Seg Size Min", "Fwd Packet Length Max", "Packet Length Mean", "Packet Length Variance"]
  continuous_idxs: ["Flow Duration", "Total Length of Fwd Packet",  "Bwd Header Length", "Flow IAT Mean", "Flow Bytes/s", "Flow Packets/s", "Fwd Seg Size Min"]
  label_col: "Label"
  time_scale: 3e-4
  src_ip_idx: "Source IP"
  dst_ip_idx: "Destination IP"
