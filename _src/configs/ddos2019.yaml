defaults:
  - base_config # ベース設定
  - _self_      # 現在のファイルの設定
model:
    k: 20
    width: 30
    verbose : True
    iter_num: 30
    learning_rate: 0.1
    anomaly: True
    C_lengthscale: 50

data:
  name: "DDoS2019"
  time_idx: "Timestamp"
  freq : "S"
  init_len :  240
  categorical_idxs : ["Protocol", "Source IP", "Destination IP"]
  # categorical_idxs : ["Protocol", "Source IP","Source Port", "Destination IP","Destination Port", "SimillarHTTP"]
  continuous_idxs: ["Flow Duration", "Total Length of Fwd Packets",  "Fwd Header Length", "ACK Flag Count", "Flow Bytes/s", "Flow Packets/s"]
  # continuous_idxs: ["Flow Duration", "Total Length of Fwd Packets", "Total Length of Bwd Packets", "Fwd Header Length", "Bwd Header Length", "Flow IAT Mean", "ACK Flag Count", "Fwd Packet Length Std", "Packet Length Std", "Bwd Packet Length Std", "min_seg_size_forward", "Flow Bytes/s", "Flow Packets/s"]
  src_ip_idx: "Source IP"
  dst_ip_idx: "Destination IP"
  label_col: "Label"
  time_scale: 0.003
